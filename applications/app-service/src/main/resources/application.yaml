server:
  port: 8081
spring:
  application:
    name: "ScaffoldQuickStart"
  devtools:
    add-properties: false
  r2dbc:
    url: r2dbc:postgresql://${SPRING_DATASOURCE_HOST}:5432/franchise_network?ssl=true&sslMode=require
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:/db/schema.sql





management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  r2dbc:
    host: ${SPRING_DATASOURCE_HOST}
    port: 5432
    database: franchise_network
    schema: ${DB_SCHEMA:public}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
